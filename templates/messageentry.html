    <!-- Araç çubuğu -->
    <div class="toolbar ml-4">
      <div id="preview" class=""></div>
      <button type="button" class="mm-button btn-aksiyon" id="emojiBtn">😀</button>
      <button type="button" class="mm-button btn-aksiyon" id="fileBtn">📎</button>
      <input type="file" id="fileInput" name="file" style="display:none">
<!--

  <!-- Emoji picker script -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
  <script>
    $(document).ready(function () {
      const textarea = document.getElementById("message");
      const preview = document.getElementById("preview");
      const sendBtn = document.getElementById("sendBtn");
      const emojiBtn = document.getElementById("emojiBtn");
      const emojiPicker = document.getElementById("emojiPicker");
      const fileBtn = document.getElementById("fileBtn");
      const fileInput = document.getElementById("fileInput");

      // Autosize textarea
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
      });

      // Enter -> gönder (Shift+Enter = yeni satır)
      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          $('#btnSend').click();
        }
      });

      // Emoji butonu
      emojiBtn.addEventListener("click", () => {
        emojiPicker.style.display =
          emojiPicker.style.display === "none" ? "block" : "none";
      });

      // Emoji seçilince textarea'ya ekle
      emojiPicker.addEventListener("emoji-click", (e) => {
        textarea.value += e.detail.unicode;
        emojiPicker.style.display = "none";
      });

      textarea.addEventListener("paste", (e) => {
        for (const item of e.clipboardData.items) {
          if (item.kind === "file") {
            const file = item.getAsFile();

            // DataTransfer kullanarak file input'a yükle
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            document.getElementById("fileInput").files = dataTransfer.files;

            // Eğer istersen önizleme
            const url = URL.createObjectURL(file);
            showPreview(url, file);
          }
        }
      });

      // Dosya yükle
      fileBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          showPreview(url, file);
        }
      });

      function showPreview(url, file) {
        // Eğer dosya image/* ise önizleme, değilse sadece isim
        if (file.type.startsWith("image/")) {
          preview.innerHTML = `<img src="${url}" alt="preview">`;
        } else {
          preview.innerHTML = `<p>${file.name}</p>`;
        }
        preview.dataset.file = file;
      }
 /*

      // Mesaj gönder
      function sendMessage() {
        console.log("Message:", textarea.value);
        if (preview.dataset.file) {
          console.log("File:", preview.dataset.file);
        }
        textarea.value = "";
        preview.innerHTML = "";
        preview.dataset.file = "";
        textarea.style.height = "auto";
      }

      sendBtn.addEventListener("click", sendMessage);
  */
 });
  </script>

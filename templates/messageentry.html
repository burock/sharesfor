<style>
    #chatbox { border: 1px solid #ccc; border-radius: 8px; padding: 10px; width: 400px; }
    textarea {
      width: 100%;
      min-height: 40px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px;
      font-size: 14px;
    }
    #preview img {
      max-height: 120px;
      margin-top: 8px;
      border-radius: 6px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      border: none;
      background: #eee;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #ddd;
    }
  </style>

  <div id="chatbox">
    <!-- Önizleme -->
    <div class='input-group mt-4 ml-4 col-xl-10'>
        <div id="preview"></div>
        <textarea type='textarea' name='message' id="message" class='form-control' placeholder='{{labels.EnterMsg}}' rows='3'></textarea>"
        <input type='submit' form='message-add' class='btn-aksiyon' value='{{labels.BtnSend}}' >
    </div>

    <!-- Araç çubuğu -->
    <div class="toolbar">
      <button type="button" id="emojiBtn">😀</button>
      <button type="button" id="fileBtn">📎</button>
      <input type="file" id="fileInput" name="file"accept="image/*" style="display:none">
<!--
      <button id="sendBtn" style="margin-left:auto; background:#007bff; color:white;">Gönder</button>
-->
    </div>

    <!-- Emoji picker -->
    <emoji-picker id="emojiPicker" style="display:none"></emoji-picker>
  </div>

  <!-- Emoji picker script -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
  <script>
    $(document).ready(function () {
      const textarea = document.getElementById("message");
      const preview = document.getElementById("preview");
      const sendBtn = document.getElementById("sendBtn");
      const emojiBtn = document.getElementById("emojiBtn");
      const emojiPicker = document.getElementById("emojiPicker");
      const fileBtn = document.getElementById("fileBtn");
      const fileInput = document.getElementById("fileInput");

      // Autosize textarea
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
      });

      // Enter -> gönder (Shift+Enter = yeni satır)
      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Emoji butonu
      emojiBtn.addEventListener("click", () => {
        emojiPicker.style.display =
          emojiPicker.style.display === "none" ? "block" : "none";
      });

      // Emoji seçilince textarea'ya ekle
      emojiPicker.addEventListener("emoji-click", (e) => {
        textarea.value += e.detail.unicode;
        emojiPicker.style.display = "none";
      });

      // Paste ile resim yakala
      textarea.addEventListener("paste", (e) => {
        for (const item of e.clipboardData.items) {
          if (item.type.startsWith("image/")) {
            const file = item.getAsFile();
            const url = URL.createObjectURL(file);
            showPreview(url, file);
          }
        }
      });

      // Dosya yükle
      fileBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          showPreview(url, file);
        }
      });

      function showPreview(url, file) {
        preview.innerHTML = `<img src="${url}" alt="preview">`;
        preview.dataset.file = file;
      }

        textarea.value = "";
        preview.innerHTML = "";
        preview.dataset.file = "";
        textarea.style.height = "auto";
      }

      sendBtn.addEventListener("click", sendMessage);
  */
 });
  </script>
